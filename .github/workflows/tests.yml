name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CarWash.slnx

      - name: Build
        run: dotnet build CarWash.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test CarWash.slnx --no-build --configuration Release